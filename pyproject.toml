[project]
name = "eu-ai-compliance-auditor"
version = "1.0.0"
description = "Local, privacy-by-design compliance audit of AI projects against the EU AI Act and the GDPR (hybrid RAG + reranker + rethinker, LangGraph agents, Ragas evaluation)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "EU AI Compliance Auditor contributors" }]
keywords = ["ai-act", "gdpr", "rag", "langgraph", "ollama", "qdrant", "ragas", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Agent orchestration & local LLM
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    # RAG
    "qdrant-client>=1.12,<2",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.10",
    # Document ingestion
    "pymupdf>=1.25",
    "pymupdf4llm>=0.0.17",
    "python-pptx>=1.0.2",
    # Typing, configuration
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # UI & export
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# Multilingual cross-encoder reranker (BAAI/bge-reranker-v2-m3): pulls torch, hence optional.
bge-reranker = ["sentence-transformers>=3.2"]

[project.scripts]
compliance-preprocess = "src.rag.preprocess_laws:main"
compliance-eval-dataset = "src.evaluation.dataset:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "pandas-stubs>=2.2",
    "types-reportlab>=4.2",
    "pre-commit>=4.0",
]
eval = [
    "ragas>=0.2.15",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PTH",      # pathlib
    "N",        # pep8-naming
    "S",        # bandit (security)
    "PL",       # pylint (subset)
    "BLE",      # broad excepts must be justified
    "T20",      # no print outside CLIs
]
ignore = [
    "PLR0913",  # dependency factories legitimately take many arguments
    "PLR2004",  # regulatory thresholds are clearer inline
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",   # ambiguous characters: French legal source text (typographic apostrophes)
    "RUF002",
    "RUF003",
    "S101",     # assert allowed (tests, type narrowing)
    "PLC0415",  # deliberate lazy imports of heavy dependencies (flashrank, ragas, pptx...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"pages/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- Mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true
exclude = ["^data/", "^build/"]

[[tool.mypy.overrides]]
module = [
    "flashrank.*",
    "rank_bm25.*",
    "pymupdf.*",
    "pymupdf4llm.*",
    "fitz.*",
    "pptx.*",
    "plotly.*",
    "ragas.*",
    "sentence_transformers.*",
    "datasets.*",
]
ignore_missing_imports = true


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not eval'"
markers = [
    "eval: Ragas evaluation (requires Ollama + Qdrant index) - `pytest -m eval tests/eval`",
    "integration: multi-module integration tests (no external service)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pymupdf.*",
    "ignore::DeprecationWarning:swig.*",
]
timeout = 600

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
