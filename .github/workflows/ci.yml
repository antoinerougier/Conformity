name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Ragas evaluation (Monday 03:17 UTC) to detect model drift.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the Ragas evaluation"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.x"
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------- Lint
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  # --------------------------------------------------------------------------- Types
  typecheck:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run mypy src tests scripts

  # --------------------------------------------------------------------------- Tests
  test:
    name: Pytest (unit + integration) — py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }} --group eval
      - name: Check that the preprocessed corpus is up to date
        run: |
          uv run python -m src.rag.preprocess_laws --out /tmp/legal_chunks.jsonl
          diff -q /tmp/legal_chunks.jsonl data/processed/legal_chunks.jsonl
      - name: Pytest
        run: >
          uv run pytest -m "not eval" --cov=src --cov-report=term
          --cov-report=xml:coverage.xml --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-py${{ matrix.python }}
          path: |
            coverage.xml
            pytest-report.xml

  # --------------------------------------------------------------------------- Docker
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eu-ai-compliance-auditor:ci
          build-args: PRELOAD_RERANKER=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------- Ragas
  ragas-eval:
    name: Ragas evaluation (local Ollama)
    runs-on: ubuntu-latest
    needs: [test]
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_eval) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-eval'))
    timeout-minutes: 120
    env:
      # Smaller models to fit a standard CPU runner (16 GB RAM). Thresholds are lowered
      # accordingly; the production configuration (qwen2.5:14b) uses the Settings defaults.
      # One small model for generation and judging (no model swapping on a 4-vCPU runner),
      # regulation-targeted contexts of 3 passages, 4 balanced samples.
      OLLAMA_BASE_URL: http://localhost:11434
      LLM_MODEL: qwen2.5:3b
      JUDGE_MODEL: qwen2.5:3b
      EMBEDDING_MODEL: bge-m3
      LLM_NUM_CTX: "8192"
      # Embedded Qdrant: no service container, no client/server version mismatch.
      QDRANT_URL: ""
      QDRANT_PATH: data/qdrant_ci
      RERANKER_BACKEND: flashrank
      RAGAS_MAX_SAMPLES: "4"
      RAGAS_CONTEXT_TOP_N: "3"
      RAGAS_TIMEOUT_S: "5400"
      RAGAS_MIN_FAITHFULNESS: "0.60"
      RAGAS_MIN_CONTEXT_RELEVANCE: "0.50"
      RAGAS_MIN_ANSWER_RELEVANCY: "0.50"
      REQUIRE_OLLAMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }} --group eval

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LLM_MODEL }}-${{ env.JUDGE_MODEL }}-${{ env.EMBEDDING_MODEL }}-v1

      - name: Cache the FlashRank reranker
        uses: actions/cache@v4
        with:
          path: .cache/rerankers
          key: flashrank-ms-marco-MultiBERT-L-12-v1

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" OLLAMA_NUM_PARALLEL=2 OLLAMA_KEEP_ALIVE=2h \
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:11434/api/tags && break; sleep 2; done

      - name: Pull the models
        run: |
          ollama pull "$LLM_MODEL"
          ollama pull "$EMBEDDING_MODEL"
          # Warm-up: load the model in memory before the timed evaluation.
          curl -fsS http://localhost:11434/api/generate -d "{\"model\": \"$LLM_MODEL\", \"prompt\": \"ok\", \"stream\": false}" > /dev/null

      - name: Index the legal corpus
        run: uv run python -m src.rag.preprocess_laws --index --recreate

      - name: Ragas evaluation (faithfulness, context relevance, answer relevancy)
        run: uv run pytest tests/eval -m eval -v --no-cov -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-report
          path: |
            tests/eval/reports/
            /tmp/ollama.log
